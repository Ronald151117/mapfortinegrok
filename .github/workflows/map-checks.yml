name: Map checks

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/map.test.mjs"
      - "package*.json"
      - ".github/workflows/map-checks.yml"
      - "scripts/map-browser-qa.sh"
  push:
    branches: ["codex/cuzcatlan-map-upgrade"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate destination search, elevation bounds and MapLibre style
        run: node scripts/map.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser tools
        run: |
          npm install -g agent-browser
          npx playwright install --with-deps chromium
      - name: Start development and built previews
        run: |
          sudo ln -s "$GITHUB_WORKSPACE" /workspace
          sh /workspace/startup.sh
          npm run preview:restart
      - name: Check real map interactions on desktop and mobile
        run: bash scripts/map-browser-qa.sh
      - name: Smoke development render
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8080 /workspace/screenshots/smoke-dev.png
      - name: Smoke production render
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8081 /workspace/screenshots/smoke-built.png --baseline /workspace/screenshots/smoke-dev.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-browser-review
          path: screenshots/
          retention-days: 7
