name: Map checks

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/map.test.mjs"
      - "package*.json"
      - ".github/workflows/map-checks.yml"
  push:
    branches: ["codex/cuzcatlan-map-upgrade"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate destination search, elevation bounds and MapLibre style
        run: node scripts/map.test.mjs
      - run: npm run typecheck
      - run: npm run build
